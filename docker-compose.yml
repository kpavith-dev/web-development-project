services:
  mongodb:
    image: mongo:6.0-alpine
    container_name: campus-parking-db
    # A single-node replica set is required so the application can use MongoDB
    # multi-document transactions (used for reservation and security operations).
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - campus-parking
    healthcheck:
      # Wait for the replica set to be initialised before reporting healthy.
      # rs.initiate() is idempotent so repeated calls are harmless.
      test:
        - "CMD-SHELL"
        - >
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "
            try { rs.status() } catch(e) {
              rs.initiate({ _id:'rs0', members:[{_id:0,host:'127.0.0.1:27017'}] })
            };
            rs.status().ok
          " | grep -q 1
      interval: 10s
      timeout: 15s
      retries: 8
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    container_name: campus-parking-app
    environment:
      PORT: 5000
      NODE_ENV: production
      # directConnection=true is required when connecting to a single-node
      # replica set via the container hostname rather than the replica-set SRV.
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/smart-campus-parking?authSource=admin&directConnection=true
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL in .env}
      TZ: Asia/Colombo
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - campus-parking
    restart: unless-stopped
    volumes:
      - app_uploads:/app/server/uploads

volumes:
  mongodb_data:
  mongodb_config:
  app_uploads:

networks:
  campus-parking:
    driver: bridge
